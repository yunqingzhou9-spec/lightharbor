<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>选择文件夹 · 拾光</title>
<style>
:root{color-scheme:light;--green:#2d684b;--ink:#242c28;--muted:#626c65;--line:#e2e6e1;--soft:#edf1eb;--canvas:#fafbf9;--focus:#498063}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.5 "Segoe UI","Microsoft YaHei",-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column}
::selection{background:#dce7da;color:#285437}button,input{font:inherit;color:inherit}button{min-height:36px;padding:6px 12px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer}button:hover{background:#e7ebe5}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,.file:focus-visible{outline:2px solid var(--focus);outline-offset:3px}input:not([type=checkbox]){min-width:0;flex:1;background:#fff;border:1px solid #d7ddd5;border-radius:7px;padding:7px 10px;caret-color:var(--green)}
header{padding:22px 24px 16px;border-bottom:1px solid var(--line)}h1{font-size:22px;line-height:1.3;letter-spacing:-.025em;margin:0 0 6px;font-weight:650}p{margin:0;color:var(--muted)}.path-bar{display:flex;gap:8px;margin-top:16px}.icon-button{padding:6px 10px;display:inline-flex;align-items:center;justify-content:center}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.workspace{display:flex;min-height:0;flex:1}nav{width:160px;flex-shrink:0;background:var(--soft);padding:18px 12px;border-right:1px solid var(--line);overflow-y:auto}nav button{display:flex;gap:8px;width:100%;align-items:center;text-align:left;background:transparent;border-color:transparent;margin-bottom:4px}nav p{font-size:12px;padding:10px 10px 6px}#locations button{font-variant-numeric:tabular-nums}.content{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}.list-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;color:var(--muted);min-height:50px}.paging{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums;font-size:12px}.paging button{min-height:30px;padding:3px 9px}.grid{overflow:auto;flex:1;min-height:0;padding:0 20px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));align-content:start;gap:20px 16px;scrollbar-color:#bccabd transparent;scrollbar-width:thin}.entry{min-width:0;margin:0}.entry .tile{width:100%;height:108px;border:0;border-radius:8px;background:#e8ece6;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:0}.entry .tile img{width:100%;height:100%;object-fit:contain}.entry .tile svg{width:38px;height:38px;color:#6c826d}.entry .folder-tile{background:#edf1eb;color:var(--green)}.entry .folder-tile:hover{background:#dfeae1}.entry .folder-tile svg{width:44px;height:44px;color:var(--green)}.name{font-size:13px;margin-top:7px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.format{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:5px;flex-wrap:wrap}.format span:first-child{font-weight:600}.entry .file{border-radius:8px}.no-preview{font-size:11px;color:var(--muted)}.message{grid-column:1/-1;align-self:start;padding:46px 12px;text-align:center;color:var(--muted)}.error{color:#a33132}.busy{opacity:.6}.busy .grid{pointer-events:none}
footer{display:flex;align-items:center;gap:16px;padding:16px 24px;border-top:1px solid var(--line);background:#fbfcfa}.selection{flex:1;min-width:0}.selection p:first-child{font-size:12px;margin-bottom:2px}.selection strong{font-size:13px;display:block;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#confirm{background:var(--green);border-color:var(--green);color:#fff;white-space:nowrap}#confirm:hover:not(:disabled){background:#24553e}#status{font-variant-numeric:tabular-nums}#notice{padding:0 20px 8px;font-size:12px;color:#a33132}#notice:empty{display:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
@media(max-width:720px){header{padding:16px}nav{width:118px;padding:14px 6px}.grid{padding:0 14px 14px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px 12px}.list-heading{padding:10px 14px}.paging{gap:4px}footer{padding:12px 16px;gap:8px}.entry .tile{height:96px}}
@media(max-width:480px){nav{width:92px}.path-bar{flex-wrap:wrap}#path{flex-basis:calc(100% - 100px)}.grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}.paging button{padding:3px 6px}footer{flex-wrap:wrap}.selection{flex-basis:100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
.folder-choice{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:7px}.folder-choice input{accent-color:var(--green);width:17px;height:17px;flex:none}
</style>
<body>
<header>
 <h1>选择文件夹</h1>
 <p>先看看里面的照片，再选择整个文件夹。</p>
 <div class="path-bar">
  <button id="up" class="icon-button" title="上一级" aria-label="上一级" disabled><svg viewBox="0 0 24 24"><path d="m6 10 6-6 6 6M12 4v16"/></svg></button>
  <label class="sr-only" for="path">文件夹路径</label><input id="path" placeholder="输入文件夹路径，也支持共享文件夹" autocomplete="off" spellcheck="false">
  <button id="go">前往</button>
 </div>
</header>
<div class="workspace">
 <nav aria-label="位置"><button id="home"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3ZM9 20v-7h6v7"/></svg>个人文件夹</button><p>磁盘</p><div id="locations"></div></nav>
 <main class="content" id="content" aria-busy="true">
  <div class="list-heading"><span id="status" role="status" aria-live="polite">正在打开文件夹…</span><div class="paging"><button id="previous" aria-label="上一页" disabled>上一页</button><button id="next" aria-label="下一页" disabled>下一页</button></div></div>
  <div id="notice" role="alert"></div>
  <div class="grid" id="grid" aria-label="当前文件夹内容"><p class="message">正在读取文件列表…</p></div>
 </main>
</div>
<footer>
 <div class="selection"><p>将选择整个文件夹，包含其子文件夹</p><strong id="selected">尚未选择</strong></div>
 <button id="addCurrent" hidden>添加当前文件夹</button><button id="cancel">取消</button><button id="confirm" disabled>选择此文件夹</button>
</footer>
<script>
'use strict';
const $=id=>document.getElementById(id);
let api,current=null,sequence=0,queue=[],active=0,observer,closing=false;
const icon=(type)=>{const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-hidden','true');const path=document.createElementNS(svg.namespaceURI,'path');path.setAttribute('d',type==='folder'?'M3 7V5h6l2 2h10v13H3Z':type==='disk'?'M4 4h16v16H4ZM4 15h16M16 18h1':'M5 3h10l4 4v14H5ZM14 3v5h5M8 12h8M8 16h5');svg.append(path);return svg;};
function busy(value){$('content').classList.toggle('busy',value);$('content').setAttribute('aria-busy',String(value));$('confirm').disabled=value||!current;$('up').disabled=value||!current||current.parent===current.path;$('previous').disabled=value||!current||!current.offset;$('next').disabled=value||!current||current.offset+current.page_size>=current.total;}
async function browse(path,offset=0){
 const seq=++sequence;queue=[];observer?.disconnect();busy(true);$('notice').textContent='';$('status').textContent='正在读取文件列表…';
 try{
  const data=await api.browse(path,offset,seq);if(seq!==sequence||closing)return;
  if(data.error)throw new Error(data.error);
  current=data;paintSelected();$('path').value=data.path;if(!data.multiple){$('selected').textContent=data.path;$('selected').title=data.path;}
  const end=Math.min(data.offset+data.page_size,data.total);$('status').textContent=data.total?`${data.offset+1}–${end} / ${data.total} 项`:'空文件夹';
  $('locations').replaceChildren();for(const root of data.roots){const b=document.createElement('button');b.append(icon('disk'),document.createTextNode(root.name));b.title=root.path;b.onclick=()=>browse(root.path);$('locations').append(b);}
  $('grid').replaceChildren();$('grid').scrollTop=0;
  observer=new IntersectionObserver(items=>{for(const item of items){if(item.isIntersecting){observer.unobserve(item.target);queue.push({element:item.target,key:item.target.dataset.key,listing:data.listing,seq});}}pump();},{root:$('grid'),rootMargin:'100px'});
  for(const entry of data.items){
   const figure=document.createElement('figure');figure.className='entry';figure.title=entry.name;
   const tile=document.createElement(entry.folder?'button':'div');tile.className='tile '+(entry.folder?'folder-tile':'file');tile.append(icon(entry.folder?'folder':'file'));
   if(entry.folder){tile.setAttribute('aria-label','打开文件夹 '+entry.name);tile.onclick=()=>browse(entry.path);}else{tile.tabIndex=0;tile.setAttribute('aria-label',entry.name+'，'+entry.format);}
   const name=document.createElement('figcaption');name.className='name';name.textContent=entry.name;
   const format=document.createElement('div');format.className='format';const label=document.createElement('span');label.textContent=entry.folder?'文件夹':entry.format;format.append(label);
   if(entry.photo){const hint=document.createElement('span');hint.className='no-preview';hint.textContent='待预览';format.append(hint);tile.dataset.key=entry.id;observer.observe(tile);}
   else if(!entry.folder){const hint=document.createElement('span');hint.textContent=entry.format==='XMP'?'附属信息':'文件';format.append(hint);}
   if(entry.folder&&data.multiple){const label=document.createElement('label');label.className='folder-choice';const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=data.selected.includes(entry.path);checkbox.setAttribute('aria-label','选择来源 '+entry.name);checkbox.onchange=()=>toggleSource(entry.path);label.append(checkbox,document.createTextNode('选为来源'));figure.append(label);}
   figure.append(tile,name,format);$('grid').append(figure);
  }
  if(!data.items.length){const empty=document.createElement('p');empty.className='message';empty.textContent='这里没有文件。仍可选择此文件夹。';$('grid').append(empty);}
  busy(false);
 }catch(error){if(seq!==sequence||closing)return;current=null;$('selected').textContent='尚未选择';$('selected').title='';$('notice').textContent=error.message||'无法读取文件夹，请重试。';$('status').textContent='文件夹未打开';const recovery=document.createElement('p');recovery.className='message';recovery.textContent='请输入其他路径，或从左侧选择位置。';$('grid').replaceChildren(recovery);busy(false);}
}
function paintSelected(){if(!current?.multiple)return;$('addCurrent').hidden=false;$('confirm').textContent='确认所选文件夹';$('selected').textContent=current.selected.length?`已选 ${current.selected.length} 个：${current.selected.join('；')}`:'尚未选择来源';$('selected').title=current.selected.join('\n');$('selected').style.whiteSpace='normal';document.querySelector('header p').textContent='勾选多个来源，点击文件夹仍可浏览缩略图。';$('addCurrent').textContent=current.selected.includes(current.path)?'移除当前文件夹':'添加当前文件夹';}
async function toggleSource(path){const r=await api.toggle(current.listing,path);if(r.error){$('notice').textContent=r.error;return;}current.selected=r.selected;paintSelected();}
$('addCurrent').onclick=()=>toggleSource(current.path);
function pump(){while(active<2&&queue.length&&!closing){const job=queue.shift();if(job.seq!==sequence)continue;active++;loadPreview(job).finally(()=>{active--;pump();});}}
async function loadPreview(job){
 const hint=job.element.parentElement?.querySelector('.no-preview');if(hint)hint.textContent='预览中…';
 try{const result=await api.preview(job.listing,job.key);if(job.seq!==sequence||closing)return;
  if(result.thumbnail){const img=document.createElement('img');img.alt='';img.src='data:image/jpeg;base64,'+result.thumbnail;job.element.replaceChildren(img);if(hint)hint.textContent='';job.element.title=result.source||'照片预览';}
  else{if(hint)hint.textContent='暂无预览';job.element.title=result.warning||'暂时无法预览，仍可扫描和复制';}
 }catch(error){if(job.seq===sequence&&hint){hint.textContent='暂无预览';job.element.title='预览失败，仍可扫描和复制';}}
}
$('go').onclick=()=>browse($('path').value.trim());$('path').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();browse($('path').value.trim());}});
$('up').onclick=()=>current&&browse(current.parent);$('home').onclick=()=>browse(current?.home);
$('previous').onclick=()=>browse(current.path,current.offset-current.page_size);$('next').onclick=()=>browse(current.path,current.offset+current.page_size);
$('confirm').onclick=async()=>{if(!current||closing)return;$('confirm').disabled=true;try{const result=await api.choose(current.listing);if(result.error){$('notice').textContent=result.error;$('confirm').disabled=false;}else{closing=true;queue=[];observer?.disconnect();}}catch(error){$('notice').textContent='未能选择文件夹，请重试。';$('confirm').disabled=false;}};
async function cancel(){if(closing)return;closing=true;queue=[];observer?.disconnect();await api.cancel();}
$('cancel').onclick=cancel;document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();cancel();}});
function ready(){if(api)return;api=window.pywebview.api;browse();}
window.addEventListener('pywebviewready',ready);if(window.pywebview?.api)ready();
</script>
</body>
</html>
